<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Градиент для ленты</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>
:root{--bg:#f4f4f8;--fg:#1d1d1f;--card:#fff;--ac:#7c3aed;--mut:#6e6e73;--ok:#22a559;--bad:#e5484d;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e0e12;--fg:#f5f5f7;--card:#1b1b22;--mut:#9a9aa6}}
:root[data-theme="dark"]{--bg:#0e0e12;--fg:#f5f5f7;--card:#1b1b22;--mut:#9a9aa6}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--fg);font:17px/1.4 -apple-system,system-ui,sans-serif;padding:16px;max-width:480px;margin:auto}
h1{font-size:24px;margin:6px 0 14px}
.card{background:var(--card);border-radius:20px;padding:16px;margin-bottom:12px}
.t{font-size:13px;color:var(--mut);text-transform:uppercase;letter-spacing:.04em;margin-bottom:10px}
button{font:inherit;font-weight:600;border:0;border-radius:14px;padding:14px;background:var(--ac);color:#fff;width:100%}
button:active{opacity:.8}
button.sec{background:transparent;color:var(--ac);border:1.5px solid var(--ac);padding:10px 14px;width:auto}
button:disabled{opacity:.4}
.two{display:flex;gap:10px}
.on{background:var(--ok)}.off{background:var(--bad)}
.row{display:flex;align-items:center;gap:12px;margin:10px 0}
input[type=color]{width:64px;height:48px;border:0;padding:0;background:none;border-radius:10px}
input[type=range]{flex:1;height:36px;accent-color:var(--ac)}
#preview{height:64px;border-radius:16px;margin-bottom:12px}
#st{display:flex;align-items:center;gap:8px;margin-top:10px;font-size:15px;color:var(--mut)}
#dot{width:10px;height:10px;border-radius:50%;background:var(--bad)}
#dot.y{background:var(--ok)}
.big{font-size:20px;font-weight:700;min-width:56px;text-align:right}
#log{font-size:12px;color:var(--mut);margin-top:8px;word-break:break-word}
</style>
</head>
<body>
<h1>Градиент для ленты</h1>

<div class="card">
  <div class="t">Подключение</div>
  <button id="conn">Найти ленту</button>
  <div id="st"><span id="dot"></span><span id="stt">Не подключено</span></div>
  <div id="log"></div>
</div>

<div class="card">
  <div class="t">Лента</div>
  <div class="two">
    <button class="on" id="pon">Включить</button>
    <button class="off" id="poff">Выключить</button>
  </div>
</div>

<div class="card">
  <div class="t">Яркость</div>
  <div class="row"><input type="range" id="br" min="5" max="100" value="100"><span class="big"><span id="bv">100</span>%</span></div>
</div>

<div class="card">
  <div class="t">Градиент</div>
  <div id="preview"></div>
  <div id="cols"></div>
  <button class="sec" id="add">+ Добавить цвет</button>
  <div class="row" style="margin-top:16px"><span>Скорость</span><input type="range" id="sp" min="1" max="60" value="6"><span class="big"><span id="sv">6</span> с</span></div>
  <div style="color:var(--mut);font-size:13px;margin:-4px 0 12px">Секунд на один переход между цветами</div>
  <button id="go">Запустить градиент</button>
</div>

<script>
const $=id=>document.getElementById(id);
let colors=['#ff0000','#ff6a00'],running=false,isOn=true,ch=null,dev=null,t0=0,last=[255,0,0];
const SV=[0xfff0,0xffe0,0xffe5,0xfee0,0xae00,0xff00,0xfd00,0xffb0,0xffd0,0xff10,0xfef0];
const CH=[0xfff3,0xffe1,0xffe9,0xfff1,0xfff2,0xfff4];

function hex2rgb(h){return [1,3,5].map(i=>parseInt(h.substr(i,2),16))}
function setSt(ok,t){$('dot').className=ok?'y':'';$('stt').textContent=t}
function log(t){$('log').textContent=t}

function renderCols(){
  $('cols').innerHTML='';
  colors.forEach((c,i)=>{
    const r=document.createElement('div');r.className='row';
    const inp=document.createElement('input');inp.type='color';inp.value=c;
    inp.oninput=()=>{colors[i]=inp.value;prev()};
    const lab=document.createElement('span');lab.style.flex='1';lab.textContent='Цвет '+(i+1);
    r.append(inp,lab);
    if(colors.length>2){
      const d=document.createElement('button');d.className='sec';d.textContent='Убрать';
      d.onclick=()=>{colors.splice(i,1);renderCols();prev()};
      r.appendChild(d);
    }
    $('cols').appendChild(r);
  });
  $('add').style.display=colors.length>=6?'none':'';
}
function prev(){
  if(running)return;
  $('preview').style.background='linear-gradient(90deg,'+[...colors,colors[0]].join(',')+')';
}
$('add').onclick=()=>{colors.push('#0000ff');renderCols();prev()};
$('sp').oninput=e=>$('sv').textContent=e.target.value;

async function send(bytes){
  if(!ch)return;
  try{
    if(ch.writeValueWithoutResponse)await ch.writeValueWithoutResponse(new Uint8Array(bytes));
    else await ch.writeValue(new Uint8Array(bytes));
  }catch(e){}
}
const rgbPkt=(r,g,b)=>[0x7e,0x07,0x05,0x03,r,g,b,0x10,0xef];
const ON=[0x7e,0x04,0x04,0xf0,0x00,0x01,0xff,0x00,0xef];
const OFF=[0x7e,0x04,0x04,0x00,0x00,0x00,0xff,0x00,0xef];
const bright=()=>+$('br').value/100;

async function showStatic(){
  if(!isOn||running)return;
  const c=hex2rgb(colors[0]).map(v=>Math.round(v*bright()));
  await send(rgbPkt(...c));
}

$('br').oninput=e=>{$('bv').textContent=e.target.value;showStatic()};
$('pon').onclick=async()=>{isOn=true;await send(ON);if(!running)setTimeout(showStatic,150)};
$('poff').onclick=async()=>{isOn=false;await send(OFF)};

$('conn').onclick=async()=>{
  if(!navigator.bluetooth){setSt(false,'Нужен Bluefy: в Safari Bluetooth не работает');return}
  try{
    setSt(false,'Открываю список устройств…');window._tm=setTimeout(()=>log('Список не открылся. Похоже, страница открыта внутри claude.ai, а там Bluetooth заблокирован.'),6000);
    dev=await navigator.bluetooth.requestDevice({acceptAllDevices:true,optionalServices:SV});clearTimeout(window._tm);
    dev.addEventListener('gattserverdisconnected',()=>{ch=null;setSt(false,'Отключено')});
    setSt(false,'Подключаюсь к '+(dev.name||'устройству')+'…');
    const srv=await dev.gatt.connect();
    ch=null;let seen=[];
    const all=await srv.getPrimaryServices().catch(()=>[]);
    for(const sv of all){
      seen.push(sv.uuid.slice(4,8));
      let cs=[];try{cs=await sv.getCharacteristics()}catch(e){}
      for(const c of cs){
        const id=parseInt(c.uuid.slice(0,8),16);
        if(CH.includes(id)&&(c.properties.write||c.properties.writeWithoutResponse)){ch=c;break}
      }
      if(ch)break;
    }
    if(!ch){setSt(false,'Подключилась, но не нашла канал управления');log('Сервисы: '+(seen.join(', ')||'нет')+'. Пришли мне это сообщение.');return}
    setSt(true,'Подключено: '+(dev.name||'лента'));log('');
    await send(ON);isOn=true;setTimeout(showStatic,200);
  }catch(e){clearTimeout(window._tm);setSt(false,'Не вышло: '+e.message);log('Закрой приложение Lotus, выключи и включи ленту из розетки, потом попробуй снова.')}
};

function frame(){
  const n=colors.length,dur=+$('sp').value*1000;
  const t=(performance.now()-t0)/dur,seg=Math.floor(t)%n,f=t%1;
  const e=f*f*(3-2*f);
  const a=hex2rgb(colors[seg]),b=hex2rgb(colors[(seg+1)%n]);
  return a.map((v,i)=>Math.round((v+(b[i]-v)*e)*bright()));
}
async function loop(){
  while(running){
    const c=frame();
    $('preview').style.background='rgb('+c.join(',')+')';
    if(isOn)await send(rgbPkt(...c));
    await new Promise(r=>setTimeout(r,80));
  }
  prev();
}
$('go').onclick=()=>{
  running=!running;
  $('go').textContent=running?'Остановить градиент':'Запустить градиент';
  if(running){t0=performance.now();if(!isOn){isOn=true;send(ON)}loop()}
  else setTimeout(showStatic,150);
};
renderCols();prev();log('Bluetooth: '+(navigator.bluetooth?'есть':'нет')+'; страница в рамке: '+(window.top!==window?'да':'нет'));
</script>
</body>
</html>
